# Pocket Vault — your passwords on your own server, in the Bitwarden apps (Go + SQLite). One container, one volume.
services:
  pocket-vault:
    image: ghcr.io/abjelosevic88/pocket-homelab-vault:latest
    container_name: pocket-vault
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # The address the Bitwarden apps use; it must be HTTPS for them.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Website icons: internal (fetched by this server) | duckduckgo | google | off
      # ICON_SERVICE: internal
      # Bitwarden's sites-that-share-logins list (e.g. Vaultwarden's global_domains.json):
      # GLOBAL_DOMAINS_FILE: /data/global_domains.json
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
